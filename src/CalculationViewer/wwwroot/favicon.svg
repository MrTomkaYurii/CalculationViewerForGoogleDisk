<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b76f6" />
      <stop offset="50%" stop-color="#2557d6" />
      <stop offset="100%" stop-color="#143fb8" />
    </linearGradient>
    <linearGradient id="cv-sigma" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#edf2ff" />
    </linearGradient>
    <linearGradient id="cv-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="cv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0a1d56" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#cv-bg)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" filter="url(#cv-shadow)" />

  <!-- Polar / optical subtle coordinate rings -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="32" cy="32" r="15" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" stroke-dasharray="2 3" />

  <!-- Bold geometric Sigma (Σ) -->
  <path d="M 18 17.5 H 46 V 23.5 H 27.5 L 36.5 32 L 27.5 40.5 H 46 V 46.5 H 18 L 30 32 Z"
        fill="url(#cv-sigma)" />

  <!-- Golden beam focus point -->
  <circle cx="46" cy="17.5" r="3.2" fill="url(#cv-gold)" stroke="#ffffff" stroke-width="1" />
</svg>
